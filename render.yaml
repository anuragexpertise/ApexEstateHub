services:
  - type: web
    name: estatehub
    env: python
    plan: standard
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:server --workers 2 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_CONFIG
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estatehub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: estatehub-redis
          property: connectionString
      - key: PGSSLMODE
        value: require

databases:
  - name: estatehub-db
    plan: starter
    region: frankfurt
    ipAllowList: []

  - name: estatehub-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
