services:
  - type: web
    name: estatehub
    env: python
    plan: standard
    healthCheckPath: /healthz
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:server --workers 2 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: FLASK_CONFIG
        value: production
      # DATABASE_URL points at the Aiven database (external to Render).
      # Set this in the Render dashboard to the Aiven connection string;
      # do NOT provision a Render PostgreSQL for it.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # SECRET_VAULT_KEY wraps each society's signing keys at rest
      # (app/services/secret_vault.py). Operator-provided; must match the key
      # the database was seeded with.
      - key: SECRET_VAULT_KEY
        sync: false
      # Optional: point at a Render Redis service (type: redis, added as a
      # separate service) or an external Redis for push/pub-sub. The app degrades
      # gracefully when unset (app/services/redis_broker.py).
      - key: REDIS_URL
        sync: false
      - key: PGSSLMODE
        value: require
