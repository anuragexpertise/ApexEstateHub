<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EstateHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px; display: flex;
            align-items: center; justify-content: center;
            font-size: 40px; font-weight: bold; color: white;
            margin: 0 auto 20px;
        }
        .login-title {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .login-subtitle { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-control {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; transition: all 0.3s;
        }
        .form-control:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .login-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .login-btn:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
        }
        .error-message {
            color: #dc3545; font-size: 14px; text-align: center;
            margin-top: 15px; padding: 10px; border-radius: 8px;
            background: rgba(220, 53, 69, 0.1);
        }
        .network-badge {
            text-align: center; margin-bottom: 15px; font-size: 12px;
            color: #888;
        }
        .network-badge .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 4px; vertical-align: middle;
        }
        .network-badge .online { background: #28a745; }
        .network-badge .offline { background: #dc3545; }
        .network-badge .checking { background: #ffc107; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">AE</div>
            <h1 class="login-title">EstateHub</h1>
            <p class="login-subtitle">Society Management System</p>
        </div>

        <div class="network-badge" id="network-badge">
            <span class="dot checking" id="net-dot"></span>
            <span id="net-label">Checking network…</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder="Email Address" required autocomplete="email">
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn">Sign In</button>
            <div id="error" class="error-message" style="display: none;"></div>
        </form>
    </div>

    <script>
        (function() {
            var badge   = document.getElementById('network-badge');
            var dot     = document.getElementById('net-dot');
            var label   = document.getElementById('net-label');
            var btn     = document.getElementById('login-btn');
            var form    = document.getElementById('loginForm');
            var errorEl = document.getElementById('error');

            function setNetworkUI(online, database) {
                if (!online) {
                    dot.className = 'dot offline';
                    label.textContent = 'No internet connection — login unavailable';
                    btn.disabled = true;
                    badge.style.display = 'block';
                } else if (database === false) {
                    dot.className = 'dot offline';
                    label.textContent = 'Database unreachable — login unavailable';
                    btn.disabled = true;
                    badge.style.display = 'block';
                } else if (database === true) {
                    dot.className = 'dot online';
                    label.textContent = 'Network OK';
                    btn.disabled = false;
                    badge.style.display = 'block';
                } else {
                    dot.className = 'dot checking';
                    label.textContent = 'Checking network…';
                    btn.disabled = true;
                    badge.style.display = 'block';
                }
            }

            function checkNetwork() {
                var online = navigator.onLine;
                if (!online) {
                    setNetworkUI(false, null);
                    return;
                }
                var start = performance.now();
                fetch('/auth/check-auth', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'},
                    cache: 'no-store',
                }).then(function(resp) {
                    var elapsed = Math.round(performance.now() - start);
                    setNetworkUI(true, resp.ok);
                }).catch(function() {
                    setNetworkUI(true, false);
                });
            }

            window.addEventListener('online',  function() { checkNetwork(); });
            window.addEventListener('offline', function() { setNetworkUI(false, null); });

            checkNetwork();

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var email    = document.getElementById('email').value;
                var password = document.getElementById('password').value;
                errorEl.style.display = 'none';

                if (!navigator.onLine) {
                    errorEl.textContent = 'No network connection. Check your internet and try again.';
                    errorEl.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Signing in…';

                try {
                    var response = await fetch('/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: email, password: password, method: 'password' })
                    });
                    var data = await response.json();
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        errorEl.textContent = data.message || 'Login failed';
                        errorEl.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'Sign In';
                    }
                } catch (err) {
                    errorEl.textContent = 'Network error. Please check your connection and try again.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
