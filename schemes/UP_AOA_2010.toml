# UP_AOA_2010 - Uttar Pradesh Apartment Owners Association.
#
# Layers: 0 = Act / Rules / Central Act (society cannot change), 1 = Model Bye-Law adoption,
# 2 = Society policy (General Body), 3 = Board decision. See README -> "Layer of Authority".
# `verification`: provisional = not checked against a source; checked = matches the text of the Act or of an
# adopted copy of the Model Bye-Laws (gazette / advocate sign-off still pending); verified = advocate signed
# off; disputed = commentary differs. Bye-law numbers follow the gazette numbering the engine has always used.
# Choices are ordered loosest -> strictest; `tighten` says which direction is stricter for Layers 2 and 3.

